$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://career-monitor.example/schemas/v1/destinations.schema.json"
title: Delivery destinations version 1
type: object
additionalProperties: false
required: [schema_version, destinations]
properties:
  schema_version:
    const: 1
  destinations:
    type: array
    maxItems: 20
    items:
      type: object
      additionalProperties: false
      required: [id, enabled, type, report_cadences, webhook_url_file]
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9-]{2,63}$"
        enabled:
          type: boolean
        type:
          const: discord
        report_cadences:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum: [daily, weekly]
        webhook_url_file:
          type: string
          minLength: 1
          maxLength: 255
