$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://career-monitor.example/schemas/v1/resume-facts.schema.json"
title: Resume facts version 1
type: object
additionalProperties: false
required:
  - schema_version
  - profile_id
  - person
  - facts
properties:
  schema_version:
    const: 1
  profile_id:
    type: string
    pattern: "^[a-z][a-z0-9-]{2,63}$"
  person:
    type: object
    additionalProperties: false
    required:
      - display_name
      - location
    properties:
      display_name:
        type: string
        minLength: 1
        maxLength: 120
      location:
        type: object
        additionalProperties: false
        required:
          - country_code
        properties:
          country_code:
            type: string
            pattern: "^[A-Z]{2}$"
          region:
            type: string
            minLength: 1
            maxLength: 120
  facts:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/fact"
$defs:
  fact:
    type: object
    additionalProperties: false
    required:
      - id
      - kind
      - status
      - statement
      - keywords
    properties:
      id:
        type: string
        pattern: "^fact-[a-z0-9][a-z0-9-]{1,62}$"
      kind:
        enum:
          - certification
          - education
          - employment
          - language
          - project
          - skill
      status:
        description: Only confirmed facts can be used as completed evidence.
        enum:
          - confirmed
          - planned
      statement:
        type: string
        minLength: 1
        maxLength: 500
      keywords:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 80
