$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://career-monitor.example/schemas/v1/schedule.schema.json"
title: Scheduler configuration version 1
type: object
additionalProperties: false
required: [schema_version, timezone, daily, weekly]
properties:
  schema_version:
    const: 1
  timezone:
    type: string
    minLength: 1
    maxLength: 100
  daily:
    $ref: "#/$defs/cadence"
  weekly:
    $ref: "#/$defs/cadence"
$defs:
  cadence:
    type: object
    additionalProperties: false
    required: [enabled, cron]
    properties:
      enabled:
        type: boolean
      cron:
        type: string
        minLength: 1
        maxLength: 100